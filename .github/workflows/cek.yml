# Dijalankan otomatis oleh GitHub setiap ada Pull Request ke main.
# PR hanya boleh di-merge kalau semua langkah di bawah berhasil (centang hijau).
name: Cek kode

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pasang package
        run: npm ci

      - name: Cek sisa penanda konflik
        run: |
          if git grep -nE '^(<<<<<<<|=======$|>>>>>>>)' -- . ':!*.md'; then
            echo "Masih ada penanda konflik di file di atas. Bereskan dulu sebelum merge."
            exit 1
          fi

      - name: Cek TypeScript
        run: npx tsc --noEmit

      - name: Cek lint
        run: npx expo lint
